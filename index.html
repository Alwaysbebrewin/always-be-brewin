<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Always Be Brewin — MTG Combo Finder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0f11; --surface: #16181c; --surface2: #1e2026;
      --border: #2a2d35; --text: #f0f0f0; --text2: #8a8f9e;
      --green: #4ade80; --blue: #60a5fa; --gold: #fbbf24;
      --red: #f87171; --purple: #a78bfa; --radius: 10px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; min-height: 100vh; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; }
    .nav-brand { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--green); }
    .nav-brand span { color: var(--text2); font-weight: 400; font-size: 13px; margin-left: 8px; }
    .nav-tabs { display: flex; gap: 4px; }
    .nav-tab { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--text2); transition: all .15s; font-family: 'Inter', sans-serif; }
    .nav-tab:hover { background: var(--surface2); color: var(--text); }
    .nav-tab.active { background: var(--surface2); color: var(--green); }
    .main { max-width: 860px; margin: 0 auto; padding: 32px 24px; }

    .search-panel { margin-bottom: 12px; }
    .search-row { display: flex; gap: 10px; }
    .card-field { margin-bottom: 8px; }
    .card-label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
    .search-input { flex: 1; width: 100%; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: border-color .15s; }
    .search-input:focus { border-color: var(--green); }

    .search-input-sm { padding: 9px 14px; font-size: 13px; max-width: 320px; }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-btn { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text2); transition: all .15s; font-family: 'Inter', sans-serif; }
    .filter-btn:hover, .filter-btn.active { border-color: var(--green); color: var(--green); background: rgba(74,222,128,.08); }
    .color-filters { align-items: center; }
    .color-pip { width: 30px; height: 30px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; cursor: pointer; border: 2px solid var(--border); opacity: .5; transition: all .15s; font-family: 'Inter', sans-serif; }
    .color-pip:hover { opacity: .8; }

    .grade-S { border-color: #4ade80; background: rgba(74,222,128,.12); }

    .grade-B { border-color: #fbbf24; background: rgba(251,191,36,.12); }

    .grade-letter { font-size: 20px; font-weight: 800; line-height: 1; }
    .grade-S .grade-letter { color: #4ade80; }
    .grade-A .grade-letter { color: #60a5fa; }
    .grade-B .grade-letter { color: #fbbf24; }
    .grade-C .grade-letter { color: #f87171; }
    .grade-pts { font-size: 9px; color: var(--text2); margin-top: 1px; }
    .combo-info { flex: 1; min-width: 0; }
    .combo-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .combo-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .meta-pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }

    .pill-bracket { background: rgba(251,191,36,.12); color: #fbbf24; }
    .combo-pieces { display: flex; gap: 6px; flex-wrap: wrap; }
    .piece-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
    .combo-expand { border-top: 1px solid var(--border); }
    .expand-inner { padding: 16px; }
    .axes { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .axis { display: flex; align-items: center; gap: 10px; }
    .axis-name { font-size: 11px; color: var(--text2); min-width: 120px; }
    .axis-track { flex: 1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .axis-fill { height: 100%; border-radius: 3px; }
    .axis-val { font-size: 11px; font-weight: 600; min-width: 28px; text-align: right; }
    .combo-desc { font-size: 12px; color: var(--text2); line-height: 1.7; margin-bottom: 16px; padding: 10px 12px; background: var(--surface2); border-radius: 6px; border-left: 2px solid var(--green); }
    .axis-points { font-size: 11px; color: var(--text2); min-width: 56px; text-align: right; }
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .metric-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 10px; text-align: center; }
    .metric-icon { font-size: 18px; line-height: 1; margin-bottom: 6px; }
    .metric-name { font-size: 10px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
    .metric-track { height: 4px; background: var(--surface); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
    .metric-fill { height: 100%; border-radius: 3px; }
    .metric-value { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
    .metric-sub { font-size: 10px; color: var(--text2); line-height: 1.35; }
    .verdict-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .verdict-box { border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.6; }
    .verdict-title { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
    .buy-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .buy-link { font-size: 11px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); text-decoration: none; transition: all .15s; font-weight: 500; }
    .buy-link:hover { border-color: var(--green); color: var(--green); }
    .buy-link.tcg { border-color: rgba(96,165,250,.3); color: var(--blue); }
    .buy-link.tcg:hover { border-color: var(--blue); }
    .buy-link.outpost { border-color: #EF9F27; background: rgba(239,159,39,.1); color: #EF9F27; font-weight: 600; }
    .buy-link.outpost:hover { background: rgba(239,159,39,.2); border-color: #EF9F27; }
    .buy-link-sub { display: block; font-size: 9px; font-weight: 400; opacity: .8; }
    .status { text-align: center; padding: 60px 20px; color: var(--text2); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lb-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background .15s; }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:hover { background: var(--surface2); }
    .lb-rank { font-size: 13px; font-weight: 700; color: var(--text2); min-width: 24px; }
    .lb-rank.top { color: var(--gold); }
    .lb-name { flex: 1; font-size: 13px; font-weight: 500; }
    .lb-price { font-size: 12px; color: var(--text2); min-width: 44px; text-align: right; }
    .lb-score { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; min-width: 64px; text-align: center; }
    .lb-S { background: rgba(74,222,128,.15); color: #4ade80; }
    .lb-A { background: rgba(96,165,250,.15); color: #60a5fa; }
    .lb-B { background: rgba(251,191,36,.15); color: #fbbf24; }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .about-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .about-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--green); }
    .about-card p { font-size: 13px; color: var(--text2); line-height: 1.6; }
    .section-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
    .card-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 24px; }
    .chevron { transition: transform .2s; display: inline-block; color: var(--text2); font-size: 12px; }
    .chevron.open { transform: rotate(180deg); }
    .visitor-badge {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--text2);
      z-index: 50;
    }
    @media (max-width: 600px) {
      .main { padding: 20px 16px; } .nav { padding: 0 16px; }
      .nav-brand span { display: none; } .about-grid { grid-template-columns: 1fr; }
      .verdict-grid { grid-template-columns: 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const LEADERBOARD = [
  { name: 'Taii Wakeen + Blazing Volley',                price: 0.75,  score: 93, grade: 'S', colors: 'RW',    pieces: 2, type: 'Soft Lock' },
  { name: 'Presence of Gond + Midnight Guard',           price: 0.52,  score: 90, grade: 'S', colors: 'GW',    pieces: 2, type: 'Infinite Tokens' },
  { name: 'Basking Broodscale + Mazirek',                price: 1.81,  score: 87, grade: 'S', colors: 'BG',    pieces: 2, type: 'Infinite Loop' },
  { name: 'Herd Baloth + Ivy Lane Denizen',              price: 1.79,  score: 84, grade: 'S', colors: 'G',     pieces: 2, type: 'Infinite Tokens' },
  { name: 'Crackdown Construct + Greaves + Ornithopter', price: 3.50,  score: 84, grade: 'S', colors: '—',     pieces: 3, type: 'Glass Cannon' },
  { name: 'Silver Myr + Hawkeye\'s Bow + Freed',        price: 1.97,  score: 83, grade: 'S', colors: 'U',     pieces: 3, type: 'Infinite Damage' },
  { name: 'Radagast + Psychosis Crawler',                price: 3.42,  score: 80, grade: 'S', colors: 'G',     pieces: 2, type: 'Drain Engine' },
  { name: 'Electro + Magda + Soulbright Flamekin',      price: 6.85,  score: 80, grade: 'S', colors: 'R',     pieces: 3, type: 'Token Engine' },
  { name: 'Bloodthirsty Conqueror + Blight-Priest',     price: 18.98, score: 79, grade: 'A', colors: 'B',     pieces: 2, type: 'Drain Engine' },
  { name: 'Fateful Discovery + Locust God + Donatello', price: 23.49, score: 79, grade: 'A', colors: 'UR',    pieces: 3, type: 'Draw Engine' },
  { name: 'Hawkeye\'s Bow + Pemmin\'s Aura + Birds',   price: 6.79,  score: 78, grade: 'A', colors: 'GUR',   pieces: 3, type: 'Infinite Damage' },
  { name: 'Shorikai + Palladium Myr + Intruder Alarm',  price: 28.50, score: 76, grade: 'A', colors: 'WU',    pieces: 3, type: 'Infinite Loop' },
  { name: 'Filigree Sages + Timeless Lotus',            price: 6.06,  score: 68, grade: 'A', colors: 'WUBRG', pieces: 2, type: 'Infinite Mana' },
  { name: 'Bramble Sovereign + Notary Hobbits',         price: 6.15,  score: 66, grade: 'A', colors: 'G',     pieces: 2, type: 'Token Engine' },
  { name: 'Scrawling Crawler + Forced Fruition + Narset', price: 15.53, score: 63, grade: 'B', colors: 'U',   pieces: 3, type: 'Hard Lock' },
  { name: 'Memnite + War-Whip + Koll + Skullclamp',    price: 3.06,  score: 55, grade: 'B', colors: 'RW',    pieces: 4, type: 'Draw Engine' },
  { name: 'Aquamoeba Engine',                           price: 11.20, score: 54, grade: 'B', colors: 'U',     pieces: 4, type: 'Draw Engine' },
  { name: 'Chatterfang Engine',                         price: 7.75,  score: 52, grade: 'B', colors: 'BG',    pieces: 4, type: 'Token Engine' },
];

function scoreCombo(combo, totalPrice) {
  const pieces = combo.uses?.length || 2;
  const colors = combo.colorIdentity?.length || 1;
  const desc = (combo.produces?.map(p => p.feature?.name || '').join(' ') + ' ' + (combo.description || '')).toLowerCase();

  // EFFORT — piece count + CMC weighted equally
  const totalCMC = combo.uses?.reduce((sum, u) => sum + (u.card?.cmc || 0), 0) || 0;
  const pieceScore = Math.max(0, Math.round(100 - ((pieces - 2) / 4) * 100));
  const cmcScore = Math.max(0, Math.round(100 - (totalCMC / 15) * 100));
  const effort = Math.round(pieceScore * 0.5 + cmcScore * 0.5);

  // CONSISTENCY — 1-2 colors = no penalty, 3+ colors = meaningful penalty
  const consistency = colors <= 2 ? 100 : Math.max(0, Math.round(100 - (colors - 2) * 25));

  // BUDGET — revised divisor $150 for more meaningful differentiation
  const budget = Math.max(0, Math.min(100, Math.round(100 - (totalPrice / 150) * 100)));

  // DISRUPTION RESIST — inverse piece count
  const disrupt = Math.max(0, Math.round(100 - pieces * 12));

  // BOARD IMPACT — keyword classification
  const impact = desc.includes('win the game') ? 100
               : desc.includes('infinite') || desc.includes('unlimited') ? 95
               : desc.includes('each turn') || desc.includes('every turn') ? 85
               : desc.includes('draw') || desc.includes('untap') ? 70
               : desc.includes('damage') || desc.includes('token') ? 60 : 40;

  const total = Math.round(
    effort * 0.35 + consistency * 0.30 + budget * 0.20 + disrupt * 0.10 + impact * 0.05
  );

  const grade = total >= 80 ? 'S' : total >= 65 ? 'A' : total >= 45 ? 'B' : 'C';
  return { total, grade, effort, consistency, budget, disrupt, impact };
}

function classifyType(combo) {
  const text = (combo.produces?.map(p => p.feature?.name || '').join(' ') + ' ' + (combo.description || '')).toLowerCase();
  if (text.includes('infinite')) return 'Infinite';
  if (text.includes('win the game')) return 'Win Con';
  if (text.includes('token')) return 'Token Engine';
  if (text.includes('draw')) return 'Draw Engine';
  if (text.includes('lock') || text.includes('opponent')) return 'Soft Lock';
  if (text.includes('mana')) return 'Mana Engine';
  return 'Synergy';
}

const COLOR_NAMES = { W: 'White', U: 'Blue', B: 'Black', R: 'Red', G: 'Green' };
const WUBRG_ORDER = ['W', 'U', 'B', 'R', 'G'];
const COLOR_IDENTITY_NAMES = {
  '': 'Colorless',
  W: 'Mono-White', U: 'Mono-Blue', B: 'Mono-Black', R: 'Mono-Red', G: 'Mono-Green',
  WU: 'Azorius', UB: 'Dimir', BR: 'Rakdos', RG: 'Gruul', WG: 'Selesnya',
  WB: 'Orzhov', UR: 'Izzet', BG: 'Golgari', WR: 'Boros', UG: 'Simic',
  WUB: 'Esper', UBR: 'Grixis', BRG: 'Jund', WRG: 'Naya', WUG: 'Bant',
  WBG: 'Abzan', WUR: 'Jeskai', UBG: 'Sultai', WBR: 'Mardu', URG: 'Temur',
  WUBR: 'Yore-Tiller', UBRG: 'Glint-Eye', WBRG: 'Dune-Brood', WURG: 'Ink-Treader', WUBG: 'Witch-Maw',
  WUBRG: 'Five-Color',
};

// Canonicalizes a color-identity array to WUBRG order so the wedge/guild
// name is correct regardless of the order colors were listed in.
function colorIdentityLabel(colorsArr) {
  if (!colorsArr) return null;
  const canonical = WUBRG_ORDER.filter(c => colorsArr.includes(c)).join('');
  const name = COLOR_IDENTITY_NAMES[canonical] || `${colorsArr.length}-color`;
  const letters = colorsArr.join('');
  return letters ? `${name} (${letters})` : name;
}

// Local ABB combos carry colorIdentity as an array (['W','U']); live
// Commander Spellbook variants carry it as a concatenated string
// identity field ("WU") instead — normalize both to an array of letters.
function getComboColors(combo) {
  if (Array.isArray(combo.colorIdentity)) return combo.colorIdentity;
  if (typeof combo.identity === 'string') return combo.identity.split('').filter(Boolean);
  return [];
}

function getMetrics(combo, sc, price, pieces) {
  const colors = combo.colorIdentity || [];

  const effortSub = sc.effort >= 90 ? 'Perfect piece count' : sc.effort >= 60 ? 'Great piece count' : sc.effort >= 35 ? 'Good piece count' : 'Many pieces required';

  const consistencySub = colors.length === 0 ? 'Colorless — any deck'
    : colors.length === 1 ? `Mono-${COLOR_NAMES[colors[0]] || colors[0]} only`
    : colors.length === 2 ? `${colors.map(c => COLOR_NAMES[c] || c).join('/')} — two colors`
    : `${colors.length}-color multicolor`;

  const budgetSub = sc.budget >= 90 ? 'Near perfect' : sc.budget >= 70 ? 'Great value' : sc.budget >= 40 ? 'Reasonable cost' : 'Pricey';

  const disruptValue = sc.disrupt >= 70 ? 'High' : sc.disrupt >= 45 ? 'Medium' : 'Low';
  const disruptSub = `${pieces} target${pieces !== 1 ? 's' : ''} for removal`;

  const impactValue = combo.produces?.[0]?.feature?.name || classifyType(combo);
  const impactSub = sc.impact >= 90 ? 'Game-ending' : sc.impact >= 70 ? 'Very strong' : sc.impact >= 50 ? 'Solid value' : 'Modest impact';

  return [
    { icon: '⚡', name: 'Effort', val: sc.effort, value: `${pieces} piece${pieces !== 1 ? 's' : ''}`, sub: effortSub, color: '#4ade80' },
    { icon: '🎯', name: 'Consistency', val: sc.consistency, value: `${sc.consistency}%`, sub: consistencySub, color: '#60a5fa' },
    { icon: '💵', name: 'Budget', val: sc.budget, value: `$${price.toFixed(2)}`, sub: budgetSub, color: '#a78bfa' },
    { icon: '🛡️', name: 'Disruption Resist', val: sc.disrupt, value: disruptValue, sub: disruptSub, color: '#fbbf24' },
    { icon: '📈', name: 'Board Impact', val: sc.impact, value: impactValue, sub: impactSub, color: '#34d399' },
  ];
}

function trackClick(store, cardName, comboName) {
  console.log(`[ABB Click] ${store} | ${cardName} | ${comboName} | ${new Date().toISOString()}`);

  const clicks = JSON.parse(localStorage.getItem('abb_clicks') || '[]');
  clicks.push({
    store,
    card: cardName,
    combo: comboName,
    timestamp: new Date().toISOString()
  });
  if (clicks.length > 500) clicks.shift();
  localStorage.setItem('abb_clicks', JSON.stringify(clicks));
}

// Type viewABBStats() in the browser console to inspect buy-link click data.
window.viewABBStats = function() {
  const clicks = JSON.parse(localStorage.getItem('abb_clicks') || '[]');
  const byStore = clicks.reduce((acc, c) => { acc[c.store] = (acc[c.store]||0)+1; return acc; }, {});
  const byCard = clicks.reduce((acc, c) => { acc[c.card] = (acc[c.card]||0)+1; return acc; }, {});
  console.log('=== ABB Click Stats ===');
  console.log('By store:', byStore);
  console.log('Top cards:', Object.entries(byCard).sort((a,b)=>b[1]-a[1]).slice(0,10));
  console.log('Total clicks:', clicks.length);
  return { byStore, byCard, total: clicks.length };
};

function ComboCard({ combo, prices }) {
  const [open, setOpen] = useState(false);
  const [fullOpen, setFullOpen] = useState(false);
  const cards = combo.uses?.map(u => u.card?.name).filter(Boolean) || [];
  const comboName = cards.join(' + ') || 'Unknown Combo';
  const price = cards.reduce((s, c) => s + (prices[c] || 0), 0);
  const sc = scoreCombo(combo, price);
  const type = classifyType(combo);
  const metrics = getMetrics(combo, sc, price, cards.length);

              {fullOpen ? '▲ Hide Full Analysis' : '▼ Full Analysis'}
            </button>
            {fullOpen && (
              <div style={{marginTop:12}}>
                {combo.description && (
                  <>
                    <div className="section-title" style={{marginBottom:6}}>How it works</div>

                  </>
                )}

                      </div>
                    );
                  })}
                </div>
                <div className="section-title" style={{marginBottom:8}}>Metrics</div>
                <div className="metrics-grid" style={{marginBottom:16}}>
                  {metrics.map(m => (
                    <div key={m.name} className="metric-card">
                      <div className="metric-icon">{m.icon}</div>
                      <div className="metric-name">{m.name}</div>
                      <div className="metric-track"><div className="metric-fill" style={{width:`${m.val}%`,background:m.color}} /></div>

                      <div className="metric-sub">{m.sub}</div>
                    </div>
                  ))}
                </div>
                {combo.upgrades && (
                  <>
                    <div className="section-title" style={{marginBottom:8}}>↑ Upgrade path</div>
                    <div style={{background:'rgba(96,165,250,0.08)',border:'1px solid rgba(96,165,250,0.2)',borderRadius:'8px',padding:'12px',fontSize:'12px',color:'#93c5fd',lineHeight:'1.7',marginBottom:16}}>

                        <div key={i} style={{marginBottom: i < combo.upgrades.length-1 ? '8px' : 0}}>
                          <strong style={{color:'#60a5fa'}}>{u.card}</strong> — {u.why}
                        </div>
                      ))}
                    </div>
                  </>
                )}
                {combo.verdict && (
                  <>
                    <div className="section-title" style={{marginBottom:8}}>Verdict</div>
                    <div className="verdict-grid" style={{marginBottom:16}}>
                      {combo.verdict.map((v,i) => {
                        const c = VERDICT_COLORS[v.color] || VERDICT_COLORS.blue;
                        return (
                          <div key={i} className="verdict-box" style={{background:`${c}14`,border:`1px solid ${c}40`}}>

                            <div style={{color:'var(--text2)'}}>{v.body}</div>
                          </div>
                        );
                      })}
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// Beta access gate
const BETA_CODE = 'ABB2026';
const betaKey = 'abb_beta_access';

function BetaGate({ onUnlock }) {
  const [input, setInput] = useState('');
  const [error, setError] = useState(false);

  function tryUnlock() {
    if (input.trim().toUpperCase() === BETA_CODE) {
      localStorage.setItem(betaKey, 'true');
      onUnlock();
    } else {
      setError(true);
      setTimeout(() => setError(false), 2000);
    }
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',padding:'20px'}}>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'12px',padding:'40px',maxWidth:'380px',width:'100%',textAlign:'center'}}>
        <div style={{fontSize:'32px',marginBottom:'12px'}}>🍺</div>
        <div style={{fontSize:'20px',fontWeight:'700',color:'var(--green)',marginBottom:'6px'}}>Always Be Brewin</div>
        <div style={{fontSize:'13px',color:'var(--text2)',marginBottom:'24px'}}>Beta Access — Enter your code to continue</div>
        <input
          style={{width:'100%',padding:'12px',background:'var(--surface2)',border:`1px solid ${error ? 'var(--red)' : 'var(--border)'}`,borderRadius:'8px',color:'var(--text)',fontSize:'16px',textAlign:'center',letterSpacing:'4px',textTransform:'uppercase',outline:'none',marginBottom:'12px',fontFamily:'Inter,sans-serif'}}
          placeholder='ENTER CODE'
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && tryUnlock()}
        />
        {error && <div style={{color:'var(--red)',fontSize:'12px',marginBottom:'12px'}}>Invalid code. Try again.</div>}
        <button
          onClick={tryUnlock}
          style={{width:'100%',padding:'12px',background:'var(--green)',color:'#0a1a0f',fontWeight:'700',fontSize:'14px',border:'none',borderRadius:'8px',cursor:'pointer',fontFamily:'Inter,sans-serif'}}
        >
          Enter Beta
        </button>
        <div style={{fontSize:'11px',color:'var(--text2)',marginTop:'16px'}}>DM @alwaysbebrewin on Instagram for access</div>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('finder');
  const [cardInputs, setCardInputs] = useState(['', '', '', '']);
  const [visibleCount, setVisibleCount] = useState(1);
  const [combos, setCombos] = useState([]);
  const [prices, setPrices] = useState({});
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [filter, setFilter] = useState('all');
  const [colorFilter, setColorFilter] = useState([]);
  const [sortMode, setSortMode] = useState('score');
  const [error, setError] = useState('');

  async function fetchPrice(name) {
    try {
      const r = await fetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(name)}`);
      if (!r.ok) return 0;
      const d = await r.json();
      return parseFloat(d.prices?.usd || 0);
    } catch { return 0; }
  }

  function updateCard(i, val) {
    setCardInputs(prev => {
      const next = [...prev];
      next[i] = val;
      return next;
    });
  }

  async function search() {
    const filledCards = cardInputs.slice(0, visibleCount).map(c => c.trim()).filter(Boolean);
    if (filledCards.length === 0) return;
    setLoading(true); setSearched(true); setError(''); setCombos([]); setPrices({});
    try {
      const abbResults = ABB_COMBOS.filter(c =>
        filledCards.every(term => {
          const t = term.toLowerCase();
          return c.uses.some(u => u.card.name.toLowerCase().includes(t)) ||
            (c.description || '').toLowerCase().includes(t);
        })
      );

      const cardsParam = filledCards.join('|');
      let liveResults = [];
      try {
        const r = await fetch(`/.netlify/functions/spellbook?cards=${encodeURIComponent(cardsParam)}`);
        if (r.ok) {
          const data = await r.json();
          liveResults = data.results || data.variants || [];
        } else {
          console.error(`[search] Live spellbook fetch failed with status ${r.status}`);
        }
      } catch (liveErr) {
        console.error('[search] Live spellbook fetch threw:', liveErr);
      }

      // Commander Spellbook returned nothing (or failed) — fall back to local ABB results only.
      const results = liveResults.length > 0 ? [...abbResults, ...liveResults] : abbResults;
      setCombos(results);

      if (results.length > 0) {
        const allCards = [...new Set(results.flatMap(c => c.uses?.map(u => u.card?.name).filter(Boolean) || []))];
        const entries = await Promise.all(allCards.map(async n => [n, await fetchPrice(n)]));
        setPrices(Object.fromEntries(entries));
      }
    } catch (e) {
      setError('Something went wrong. Please try again.');
    } finally { setLoading(false); }
  }

  const FILTERS = ['all','Infinite','Token Engine','Draw Engine','Soft Lock','Mana Engine'];
  const COLORS = ['W','U','B','R','G'];

  const filtered = combos.filter(c => {
    const typeOk = filter === 'all' || classifyType(c) === filter;
    const colors = getComboColors(c);
    const colorOk = colorFilter.length === 0 || colors.every(col => colorFilter.includes(col));
    return typeOk && colorOk;
  });

  const sorted = [...filtered].sort((a, b) => {
    const priceOf = c => (c.uses?.map(u => u.card?.name).filter(Boolean) || []).reduce((s, n) => s + (prices[n] || 0), 0);
    if (sortMode === 'price') return priceOf(a) - priceOf(b);
    return scoreCombo(b, priceOf(b)).total - scoreCombo(a, priceOf(a)).total;
  });

  return (
    <>
      <nav className="nav">
        <div className="nav-brand">🍺 Always Be Brewin <span>MTG Combo Finder</span></div>
        <div className="nav-tabs">
          {[['finder','Combos'],['leaderboard','Leaderboard'],['about','Scoring']].map(([id,label]) => (
            <button key={id} className={`nav-tab ${tab===id?'active':''}`} onClick={() => setTab(id)}>{label}</button>
          ))}
        </div>
      </nav>
      <div className="main">
        {tab === 'finder' && (
          <>
            <div className="hero">
              <h1>Find your <em>next combo</em></h1>
              <p>Search any card — scored instantly with the ABB Value System across effort, consistency, budget, disruption resistance, and board impact.</p>
            </div>
            <div className="search-panel">
              <div className="card-field">
                <label className="card-label">Card 1</label>
                <div className="search-row">
                  <input className="search-input" placeholder="e.g. Herd Baloth" value={cardInputs[0]} onChange={e => updateCard(0, e.target.value)} onKeyDown={e => e.key==='Enter' && search()} />
                  <button className="search-btn" onClick={search} disabled={loading}>{loading ? 'Searching...' : 'Find Combos'}</button>
                </div>
              </div>
              {cardInputs.slice(1, visibleCount).map((val, idx) => {
                const i = idx + 1;
                return (
                  <div className="card-field" key={i}>
                    <label className="card-label">Card {i + 1}</label>
                    <input className="search-input search-input-sm" placeholder="optional" value={val} onChange={e => updateCard(i, e.target.value)} onKeyDown={e => e.key==='Enter' && search()} />
                  </div>
                );
              })}
              {visibleCount < 4 && (
                <button type="button" className="add-card-link" onClick={() => setVisibleCount(v => Math.min(4, v + 1))}>+ Add card</button>
              )}
            </div>
            <div className="filters" style={{marginBottom:10}}>
              {FILTERS.map(f => <button key={f} className={`filter-btn ${filter===f?'active':''}`} onClick={() => setFilter(f)}>{f==='all'?'All types':f}</button>)}
              <button className="filter-btn" onClick={() => setSortMode(m => m === 'score' ? 'price' : 'score')}>
                {sortMode === 'score' ? 'Sort: Score ↓' : 'Sort: Price ↑'}
              </button>
            </div>
            <div className="filters color-filters">
              <button className={`filter-btn ${colorFilter.length===0?'active':''}`} onClick={() => setColorFilter([])}>All Colors</button>
              {COLORS.map(col => (
                <button
                  key={col}
                  className={`color-pip color-${col} ${colorFilter.includes(col) ? 'active' : ''}`}
                  title={COLOR_NAMES[col]}
                  onClick={() => setColorFilter(prev => prev.includes(col) ? prev.filter(x => x !== col) : [...prev, col])}
                >{col}</button>
              ))}
            </div>
            {loading && <div className="status"><div className="spinner"/><div>Scoring results from Commander Spellbook...</div></div>}
            {error && <div className="status" style={{color:'var(--red)'}}>{error}</div>}
            {!loading && searched && sorted.length === 0 && !error && <div className="status">No combos found for "{cardInputs.slice(0, visibleCount).map(c => c.trim()).filter(Boolean).join(' + ')}".</div>}
            {!loading && !searched && <div className="status"><div style={{fontSize:32,marginBottom:12}}>🍺</div><div style={{fontWeight:600,marginBottom:6}}>Start brewing</div><div style={{marginBottom:8}}>Search any card from our hand-scored ABB database.</div><div style={{fontSize:11,color:'var(--text2)'}}>Try: Herd Baloth · Midnight Guard · Mazirek · Taii Wakeen · Scrawling Crawler</div></div>}
            {sorted.map((c,i) => <ComboCard key={c.id||i} combo={c} prices={prices} />)}
            {sorted.length > 0 && <div style={{textAlign:'center',padding:'16px 0',color:'var(--text2)',fontSize:12}}>Showing {sorted.length} combo{sorted.length!==1?'s':''} · Prices from Scryfall · Combos from Commander Spellbook</div>}
          </>
        )}
        {tab === 'leaderboard' && (
          <>
            <div className="hero"><h1>ABB <em>Leaderboard</em></h1><p>Every hand-scored combo — ranked by the ABB Value System.</p></div>
            <div className="card-wrap">
              {LEADERBOARD.map((c,i) => (
                <div key={c.name} className="lb-row">
                  <span className={`lb-rank ${i<3?'top':''}`}>#{i+1}</span>
                  <span className="lb-name">{c.name}</span>
                  <span className="lb-price">${c.price.toFixed(2)}</span>
                  <span className={`lb-score lb-${c.grade}`}>{c.grade} · {c.score}</span>
                </div>
              ))}
            </div>
          </>
        )}
        {tab === 'about' && (
          <>
            <div className="hero"><h1>The ABB <em>Scoring System</em></h1><p>Five weighted axes, live pricing, zero guesswork. Every combo scored 0–100.</p></div>
            <div className="section-title">Score Axes</div>
            <div className="about-grid" style={{marginBottom:24}}>
              {[
                ['Effort (35%)','Piece count and total mana cost weighted equally. Cheap 2-card combos score near-perfect.'],
                ['Consistency (30%)','1-2 colors score perfect. Each color beyond that costs 25 points.'],
                ['Budget (20%)','Live prices from Scryfall. $1 combos score near-perfect.'],
                ['Disruption Resist (10%)','Fewer pieces = fewer removal targets. 2-card combos win.'],
                ['Board Impact (5%)','Infinite = 95. Sustained advantage = 85. Burst = 70.'],
              ].map(([n,d]) => <div key={n} className="about-card"><h3>{n}</h3><p>{d}</p></div>)}
            </div>
            <div className="section-title">Grades</div>
            <div className="about-grid">
              {[['S','80–100','#4ade80','Elite. Run this.'],['A','65–79','#60a5fa','Strong. Worth including.'],['B','45–64','#fbbf24','Situational. Right shell matters.'],['C','0–44','#f87171','Weak. Usually better options exist.']].map(([g,r,c,d]) => (
                <div key={g} className="about-card" style={{borderColor:c+'44'}}>
                  <h3 style={{color:c}}>{g} · {r}</h3><p>{d}</p>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </>
  );
}

function Root() {
  const [unlocked, setUnlocked] = useState(
    localStorage.getItem(betaKey) === 'true'
  );
  if (!unlocked) return <BetaGate onUnlock={() => setUnlocked(true)} />;
  return <App />;
}

ReactDOM.render(<Root />, document.getElementById('root'));
